<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src data:; font-src 'self'">
<link rel="stylesheet" href="xterm.css"><style>
html,body,#terminal{width:100%;height:100%;margin:0;overflow:hidden;background:#10141c}#terminal{box-sizing:border-box;padding:8px}.xterm{height:100%}.xterm-viewport::-webkit-scrollbar{width:4px}.xterm-viewport::-webkit-scrollbar-thumb{background:#536075;border-radius:2px}
</style></head><body><div id="terminal"></div><script src="xterm.js"></script><script src="addon-fit.js"></script><script>
'use strict';
const terminal=new Terminal({fontFamily:'Menlo, ui-monospace, monospace',fontSize:13,lineHeight:1.2,scrollback:3000,cursorBlink:true,convertEol:false,allowProposedApi:false,theme:{background:'#10141c',foreground:'#e1e7f0',cursor:'#8ec5ff',selectionBackground:'#355677'}});
const fitAddon=new FitAddon.FitAddon();terminal.loadAddon(fitAddon);terminal.open(document.getElementById('terminal'));
function send(type,value){window.webkit.messageHandlers.dylixTerminal.postMessage({type,value});}
terminal.onData(data=>send('input',data));terminal.onResize(size=>send('resize',size));
window.dylixWrite=function(base64){const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));terminal.write(bytes);};
window.dylixFocus=function(){terminal.focus();};
window.dylixClear=function(){terminal.clear();};
function resize(){fitAddon.fit();}new ResizeObserver(resize).observe(document.getElementById('terminal'));
requestAnimationFrame(()=>{resize();send('ready',{cols:terminal.cols,rows:terminal.rows});});
</script></body></html>
